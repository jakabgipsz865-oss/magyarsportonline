# Editorial style A/B test — a szerkesztőségi stílus sprint kért mérése:
# lefuttatja a jelenlegi pipeline kimenetét (Pipeline A) és az Editorial
# Rewrite Agent stilizált változatát (Pipeline B) ugyanazokon a már publikált
# cikkeken, olvashatósági metrikákkal, tartalom-minőségi heurisztikákkal és
# egy vak LLM-judge összehasonlítással.
#
# Kizárólag olvasás — a `/api/internal/editorial-ab-test` végpont sosem ír az
# adatbázisba. Kötegelve fut (alapértelmezés: 5 cikk/hívás), mert a Vercel
# Hobby csomag 60 másodperces `maxDuration`-je nem bírná el 50 cikk összes
# LLM-hívását egyetlen kérésben.
name: Editorial style A/B test

on:
  workflow_dispatch:
    inputs:
      sample_size:
        description: "Hány cikket hasonlítson össze (Pipeline A vs Editorial Rewrite)"
        required: false
        default: "10"
      batch_size:
        description: "Cikk/HTTP-hívás (max 10, a Vercel 60s limit miatt)"
        required: false
        default: "5"

permissions: {}

jobs:
  ab-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Run batched A/B comparison
        env:
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SAMPLE_SIZE: ${{ inputs.sample_size }}
          BATCH_SIZE: ${{ inputs.batch_size }}
        run: |
          set -u
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "CRON_SECRET repo secret hiányzik — nincs mit futtatni." >&2
            exit 1
          fi
          BASE="${PRODUCTION_URL:-https://magyarsportonline-web.vercel.app}"
          echo "Target: $BASE"
          echo "[]" > all-results.json
          echo "[]" > all-errors.json

          offset=0
          fetched=0
          while [ "$fetched" -lt "$SAMPLE_SIZE" ]; do
            limit=$BATCH_SIZE
            remaining=$((SAMPLE_SIZE - fetched))
            if [ "$remaining" -lt "$limit" ]; then limit=$remaining; fi

            echo "== batch offset=$offset limit=$limit =="
            code=$(curl -sS -o batch.json -w '%{http_code}' --max-time 60 \
              -X POST "$BASE/api/internal/editorial-ab-test?offset=$offset&limit=$limit" \
              -H "Authorization: Bearer $CRON_SECRET" || echo 000)
            echo "HTTP $code"
            if [ "$code" != "200" ]; then
              cat batch.json
              exit 1
            fi

            batch_count=$(jq '.results | length' batch.json)
            jq -s '.[0] + .[1].results' all-results.json batch.json > merged.json && mv merged.json all-results.json
            jq -s '.[0] + .[1].errors' all-errors.json batch.json > merged-errors.json && mv merged-errors.json all-errors.json
            fetched=$((fetched + batch_count))

            next_offset=$(jq -r '.nextOffset' batch.json)
            total_candidates=$(jq -r '.totalCandidates' batch.json)
            echo "fetched so far: $fetched / totalCandidates in DB: $total_candidates"

            if [ "$batch_count" -eq 0 ] || [ "$next_offset" = "null" ]; then
              echo "Nincs több AI-generált cikk a DB-ben — a teszt a rendelkezésre álló mennyiséggel zárul."
              break
            fi
            offset=$next_offset
          done

          echo "total collected: $(jq 'length' all-results.json)"
          echo "total errors: $(jq 'length' all-errors.json)"

      - name: Summarize results
        run: |
          python3 << 'PYEOF'
          import json

          with open("all-results.json") as f:
              results = json.load(f)
          with open("all-errors.json") as f:
              errors = json.load(f)

          n = len(results)
          attempted = n + len(errors)
          accepted = [r for r in results if r["pipelineB"]["rewriteAccepted"]]
          rejected_fact = [r for r in results if r["pipelineB"]["rejectionKind"] == "fact_check_failed"]
          rejected_fallback = [r for r in results if r["pipelineB"]["rejectionKind"] == "fallback"]
          judged = [r for r in results if r["judge"] is not None]

          def avg(xs):
              return sum(xs) / len(xs) if xs else 0.0

          def pct(part, whole):
              return (100.0 * part / whole) if whole else 0.0

          a_sent = avg([r["pipelineA"]["readability"]["avgSentenceLengthWords"] for r in results])
          b_sent = avg([r["pipelineB"]["readability"]["avgSentenceLengthWords"] for r in results])
          a_word = avg([r["pipelineA"]["readability"]["avgWordLengthChars"] for r in results])
          b_word = avg([r["pipelineB"]["readability"]["avgWordLengthChars"] for r in results])

          def count_issue_kind(rs, side, kind):
              return sum(
                  1 for r in rs for issue in r[side]["quality"]["issues"] if issue["kind"] == kind
              )

          a_unnatural = count_issue_kind(results, "pipelineA", "looks_english")
          b_unnatural = count_issue_kind(results, "pipelineB", "looks_english")
          a_repeat = count_issue_kind(results, "pipelineA", "repeated_paragraph") + count_issue_kind(
              results, "pipelineA", "duplicates_body"
          )
          b_repeat = count_issue_kind(results, "pipelineB", "repeated_paragraph") + count_issue_kind(
              results, "pipelineB", "duplicates_body"
          )

          wins_a = sum(1 for r in judged if r["judge"]["winner"] == "A")
          wins_b = sum(1 for r in judged if r["judge"]["winner"] == "B")
          ties = sum(1 for r in judged if r["judge"]["winner"] == "tie")
          score_a = avg([r["judge"]["scoreA"] for r in judged])
          score_b = avg([r["judge"]["scoreB"] for r in judged])

          def calls_of(kind):
              return [r["perCallUsage"][kind] for r in results if r["perCallUsage"][kind] is not None]

          def call_stats(kind):
              calls = calls_of(kind)
              n_calls = len(calls)
              fallbacks = [c for c in calls if c["isFallback"]]
              quota_429 = [c for c in calls if c.get("fallbackReason") == "quota_exceeded"]
              return {
                  "n": n_calls,
                  "input_tokens": sum(c["inputTokens"] for c in calls),
                  "output_tokens": sum(c["outputTokens"] for c in calls),
                  "neurons": sum(c["estimatedNeurons"] for c in calls),
                  "fallback_rate": pct(len(fallbacks), n_calls),
                  "rate_429": pct(len(quota_429), n_calls),
              }

          rewrite_stats = call_stats("rewrite")
          self_check_stats = call_stats("selfCheck")
          judge_stats = call_stats("judge")

          total_input_tokens = sum(r["totalUsage"]["inputTokens"] for r in results)
          total_output_tokens = sum(r["totalUsage"]["outputTokens"] for r in results)
          total_neurons = sum(r["totalUsage"]["estimatedNeurons"] for r in results)
          avg_duration_ms = avg([r["durationMs"] for r in results])

          lines = []
          lines.append(f"# Editorial style A/B teszt — {n}/{attempted} cikk (kísérlet vs sikeresen feldolgozott)\n")

          lines.append("## 1) Tényellenőrzési visszagörgetés (safety net) igazolása\n")
          lines.append(f"- Rewrite elfogadva (tény-konzisztens és nem fallback): **{len(accepted)}/{n}** ({pct(len(accepted), n):.0f}%)")
          lines.append(f"- Elutasítva tényellenőrzés miatt (hallucináció/eltérés gyanúja — eredeti szöveg maradt): **{len(rejected_fact)}/{n}**")
          lines.append(f"- Elutasítva No-LLM/fallback miatt (nem volt mit átírni): **{len(rejected_fallback)}/{n}**")
          lines.append(f"- Feldolgozási hiba (kihagyva, nem számít bele a fenti arányokba): **{len(errors)}/{attempted}**\n")

          lines.append("## 2) Olvashatósági és ismétlődési mutatók (átlag)\n")
          lines.append("| Metrika | Pipeline A (jelenlegi) | Pipeline B (Editorial Rewrite) |")
          lines.append("|---|---|---|")
          lines.append(f"| Átlagos mondathossz (szó) | {a_sent:.1f} | {b_sent:.1f} |")
          lines.append(f"| Átlagos szóhossz (karakter) | {a_word:.2f} | {b_word:.2f} |")
          lines.append(f"| Magyartalan (angolnak ható) mező-találat | {a_unnatural} | {b_unnatural} |")
          lines.append(f"| Ismétlődő/duplikált bekezdés-találat | {a_repeat} | {b_repeat} |\n")
          lines.append("_A „magyartalan” és „ismétlődés” számok a Hungarian Writer Agent már éles Content Quality Gate heurisztikájából jönnek (`assessContentQuality` — `looks_english`, `repeated_paragraph`, `duplicates_body`), ugyanazon a szövegen futtatva mindkét pipeline kimenetére._\n")

          lines.append("## 3) LLM-judge vak összehasonlítás (0-10 olvashatósági pont)\n")
          lines.append(f"- A (jelenlegi) győzött: **{wins_a}**")
          lines.append(f"- B (Editorial Rewrite) győzött: **{wins_b}**")
          lines.append(f"- Döntetlen: **{ties}**")
          lines.append(f"- Átlagpontszám A: **{score_a:.2f}** / B: **{score_b:.2f}**")
          lines.append("- FONTOS: ez önmagában NEM elégséges bizonyíték — lásd a mennyiségi metrikákat is fent és a cím/lead párokat lent.\n")

          lines.append("## 4) Erőforrás-fogyasztás és megbízhatóság\n")
          lines.append(f"- Összes Cloudflare token (input+output), a mintában: **{total_input_tokens + total_output_tokens}** ({total_input_tokens} input / {total_output_tokens} output)")
          lines.append(f"- Átlagos token/cikk: **{(total_input_tokens + total_output_tokens) / n if n else 0:.0f}**")
          lines.append(f"- **Becsült összes Neuron-fogyasztás: {total_neurons:.1f}** (Cloudflare listaár alapján számolva: $0.011/1000 Neuron — a Workers AI válasza csak tokent ad vissza, Neuront nem; a pontos, mért érték kizárólag a Cloudflare dashboardon [Workers AI → Analytics] ellenőrizhető)")
          lines.append(f"- **Becsült Neuron/cikk: {(total_neurons / n if n else 0):.1f}**\n")
          lines.append("| Hívás típusa | Hívások | Input token | Output token | Becsült Neuron | Fallback arány | Ebből 429 (kvóta) arány |")
          lines.append("|---|---|---|---|---|---|---|")
          for label, stats in (("Rewrite", rewrite_stats), ("Self-check", self_check_stats), ("Judge", judge_stats)):
              lines.append(
                  f"| {label} | {stats['n']} | {stats['input_tokens']} | {stats['output_tokens']} | "
                  f"{stats['neurons']:.1f} | {stats['fallback_rate']:.1f}% | {stats['rate_429']:.1f}% |"
              )
          lines.append("")
          lines.append(f"- Átlagos feldolgozási idő/cikk: **{avg_duration_ms:.0f} ms**")
          lines.append(f"- Feldolgozási hiba arány (a kísérlet szintjén — nem a live pipeline-ban): **{pct(len(errors), attempted):.1f}%**")
          lines.append("- Külön „timeout” arány: a jelenlegi LLM-kliens réteg (ProviderFallbackLlmClient) minden hibát — hálózati hibát, kvótát, timeoutot — ugyanabba a fallback-ágba terel; a fenti táblázat \"429 (kvóta)\" oszlopa csak azt méri, amit a `describeError` kifejezetten HTTP 429-ként azonosít, minden más hibatípus a \"fallback arány\"-ban jelenik meg, külön nem bontható tovább.\n")

          verdict = "B (Editorial Rewrite) olvashatóbb" if wins_b > wins_a and score_b > score_a else (
              "A (jelenlegi) olvashatóbb" if wins_a > wins_b and score_a > score_b else "nincs egyértelmű különbség"
          )
          lines.append(f"## 5) Összegzés (csak ebből a futtatásból): **{verdict}**\n")

          sample_count = min(15, n)
          lines.append(f"## 6) Cím/lead párok — {sample_count} konkrét példa (előtte/utána)\n")
          for i, r in enumerate(results[:sample_count], start=1):
              lines.append(f"**{i}. story_id={r['storyId']}**")
              lines.append(f"- A cím: {r['pipelineA']['titleHu']}")
              lines.append(f"  A lead: {r['pipelineA']['leadHu']}")
              lines.append(f"- B cím: {r['pipelineB']['titleHu']}")
              lines.append(f"  B lead: {r['pipelineB']['leadHu']}")
              if not r["pipelineB"]["rewriteAccepted"]:
                  lines.append(f"  → B == A (elutasítva: {r['pipelineB']['rejectionKind']}, indok: {r['pipelineB']['rejectionReason']})")
              elif r["judge"]:
                  lines.append(f"  → judge: **{r['judge']['winner']}** jobb (A={r['judge']['scoreA']:.1f}, B={r['judge']['scoreB']:.1f}) — {r['judge']['rationaleHu']}")
              lines.append("")

          if errors:
              lines.append("## 7) Feldolgozási hibák\n")
              for e in errors[:10]:
                  lines.append(f"- story_id={e['storyId']}: {e['message']}")
              lines.append("")

          report = "\n".join(lines)
          print(report)
          with open("report.md", "w") as f:
              f.write(report)
          PYEOF
          cat report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Dump raw results to job log
        run: |
          echo "===RAW_ALL_RESULTS_JSON_START==="
          jq -c '.' all-results.json
          echo "===RAW_ALL_RESULTS_JSON_END==="

      - name: Upload full results
        uses: actions/upload-artifact@v4
        with:
          name: editorial-ab-test-results
          path: |
            all-results.json
            all-errors.json
            report.md
