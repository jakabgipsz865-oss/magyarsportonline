name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-test-build:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest

    # ADR 0007 óta az apps/web build ténylegesen migrál (`db:migrate` a
    # `next build` előtt fut) — a korábbi, kizárólag séma-validációra szánt
    # DATABASE_URL placeholder emiatt ECONNREFUSED-dal elbukott, mert semmi
    # nem hallgatott a localhost:5432-n. A pgvector kiterjesztést maga a
    # migráció hozza létre (0000_*.sql: `CREATE EXTENSION IF NOT EXISTS
    # vector`), a service image csak az üres Postgres szervert adja.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        # apps/web/lib/env.ts validates DATABASE_URL/CRON_SECRET at module
        # load, and (ADR 0007) the build now actually runs `db:migrate`
        # against DATABASE_URL before `next build` — so this must point at
        # the real `postgres` service above, not a placeholder. The `ci`
        # user/password/db here match the service's POSTGRES_* env exactly.
        # ANTHROPIC_API_KEY stays a placeholder (LLM_PROVIDER defaults to
        # "none", never called). Real secrets are Vercel Environment
        # Variables, set separately per environment
        # (docs/architecture/06-deployment.md §6.6) — CI never sees them.
        run: pnpm build
        env:
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci
          ANTHROPIC_API_KEY: ci-placeholder-key
          CRON_SECRET: ci-placeholder-secret

      # A docs/architecture/06-deployment.md §6.4 egy további CI-lépést ír elő:
      # "DB migráció dry-run Neon preview branch ellen". Ez Neon-projekt és
      # valódi GitHub Secrets (pl. NEON_API_KEY) megléte nélkül nem
      # megvalósítható — ezt a lépést a roadmap Fázis 1 4. lépése (Neon
      # projekt létrehozása, docs/architecture/08-roadmap.md) után kell
      # hozzáadni, amikor van tényleges Neon-projekt és hitelesítő adat.
      # Szándékosan nem került be egy hamis/hibázó placeholder lépésként.

  # A production publikus végpontjainak próbája minden main-push után.
  # Szándékosan continue-on-error: a deploy/env-hiány diagnosztikai jel,
  # nem a kód hibája — a log adja a production állapotképét. (Külön
  # workflow_dispatch smoke workflow is létezik: production-smoke.yml,
  # de az csak azután indítható kézzel, hogy a repo default branche main.)
  production-smoke-public:
    name: Production smoke (public endpoints)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 12
    steps:
      - name: Probe production public endpoints
        env:
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
        run: |
          BASE="${PRODUCTION_URL:-https://magyarsportonline-web.vercel.app}"
          echo "Target: $BASE"
          # Megvárjuk, míg a most pusholt commit Vercel production deploya kifut
          # (a V1-et az /rss.xml megléte jelzi) — max ~6 perc.
          deployed=no
          for i in $(seq 1 24); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$BASE/rss.xml" || echo 000)
            if [ "$code" = "200" ]; then deployed=yes; break; fi
            echo "  waiting for V1 production deploy... (/rss.xml -> $code)"
            sleep 15
          done
          echo "V1 deployed on production: $deployed"
          FAILURES=0
          check() {
            local name="$1" url="$2" expected="$3" code
            code=$(curl -sS -o /tmp/b -w '%{http_code}' --max-time 60 "$url" || echo 000)
            if [ "$code" = "$expected" ]; then echo "PASS  $name ($code)"; else
              echo "FAIL  $name (got $code, expected $expected)"; head -c 300 /tmp/b; echo; FAILURES=$((FAILURES+1)); fi
          }
          check "home"        "$BASE/"               200
          check "api stories" "$BASE/api/v1/stories" 200
          check "rss.xml"     "$BASE/rss.xml"        200
          check "sitemap.xml" "$BASE/sitemap.xml"    200
          check "robots.txt"  "$BASE/robots.txt"     200
          check "cron auth"   "$BASE/api/internal/cron/dispatch-ingest" 401
          admin=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 60 "$BASE/admin/review" || echo 000)
          echo "admin/review status: $admin (401 = ADMIN_SECRET beállítva; 503 = hiányzik)"
          echo "FAILURES=$FAILURES"
          exit $([ "$FAILURES" -eq 0 ] && echo 0 || echo 1)
