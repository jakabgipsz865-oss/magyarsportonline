# Egyszeri, kézi validációs workflow a Cloudflare Workers AI éles bekapcsolásához
# (LLM_PROVIDER=cloudflare). Nem a normál CI/CD útvonal része: kizárólag erre a
# fejlesztési branch-re pusholva fut le (a production-smoke.yml és a
# scheduled-ingest.yml workflow_dispatch/schedule triggerei a repo default
# branch-éről regisztrálódnak — az jelenleg nem `main`, ezért azok API-n
# keresztül nem indíthatók; ez a workflow push-triggerrel ezt a korlátot
# megkerüli, main-t nem érinti).
#
# Két, egymástól független rész:
# 1. "cloudflare-fallback-proof" — nem igényel semmilyen repo-secretet: a
#    valódi Cloudflare Workers AI REST API-t hívja szándékosan érvénytelen
#    account-id/token-nel, hogy éles HTTP-hibaválaszt (401/403) kapjunk, majd
#    ugyanezt a hibát a ProviderFallbackLlmClient-tel (packages/llm) is
#    végigfuttatja — bizonyítva, hogy a No-LLM fallback éles hiba esetén is
#    lefut, nem csak a unit tesztek mock-jaival.
# 2. "production-validation" — csak akkor fut érdemben, ha a PRODUCTION_URL /
#    CRON_SECRET / ADMIN_SECRET repo-secretek be vannak állítva (Settings →
#    Secrets and variables → Actions); enélkül SKIPPED üzenettel lép ki.
#    Lefuttatja a production seedet, egy valódi BBC Football RSS ingestet, és
#    kiírja a review queue tartalmát (cím/lead) manuális magyar
#    minőség-értékeléshez, anélkül hogy bármelyik secretet valaha látná ez a
#    session — a GitHub Actions injektálja őket a job futásába.
name: Cloudflare live validation (one-off)

on:
  push:
    branches: [claude/magyarsportonline-v1-launch-j26j54]
  workflow_dispatch:

permissions: {}

jobs:
  cloudflare-fallback-proof:
    name: Live Cloudflare error → No-LLM fallback proof
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Real Cloudflare Workers AI call with invalid credentials
        run: |
          set -u
          echo "== 1) Valódi HTTP-hívás a Cloudflare Workers AI API-ra, szándékosan érvénytelen accountId/token-nel =="
          code=$(curl -sS -o /tmp/cf-error.json -w '%{http_code}' --max-time 30 \
            -X POST "https://api.cloudflare.com/client/v4/accounts/0000000000000000000000000000000/ai/v1/chat/completions" \
            -H "authorization: Bearer invalid-token-for-fallback-proof-only" \
            -H "content-type: application/json" \
            -d '{"model":"@cf/qwen/qwen3-30b-a3b-fp8","messages":[{"role":"user","content":"test"}]}' || echo 000)
          echo "HTTP $code"
          cat /tmp/cf-error.json; echo
          if [ "$code" -ge 400 ]; then
            echo "PASS  a valódi Cloudflare API 4xx/5xx-et ad érvénytelen hitelesítésre — ez pontosan az a hibaosztály, amit a CloudflareApiError(kind:\"http\") elkap"
          else
            echo "WARN  váratlan státusz ($code) — nem tudjuk demonstrálni az élő hibaválaszt ezzel a hívással"
          fi

      - name: Checkout (for the existing automated fallback test suite)
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run the Cloudflare adapter + ProviderFallbackLlmClient test suite
        run: |
          echo "== 2) Kódszintű igazolás: packages/llm automatizált tesztjei ugyanerre a hibaosztályra (http/network/parse_error/schema_error/error_envelope) =="
          pnpm --filter @magyarsportonline/llm test -- cloudflare-client provider-fallback-client

  production-validation:
    name: Production seed + real BBC ingest + review queue dump
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Run production validation
        env:
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
        run: |
          set -u
          BASE="${PRODUCTION_URL:-https://magyarsportonline-web.vercel.app}"
          echo "Target: $BASE"

          if [ -n "${ADMIN_SECRET:-}" ]; then
            echo "== Cloudflare Workers AI diagnosztika — miért esik vissza minden hívás No-LLM módra? (friss deployra várva, max ~3 perc) =="
            for i in $(seq 1 12); do
              code=$(curl -sS -o /tmp/cfcheck.json -u "admin:$ADMIN_SECRET" -w '%{http_code}' --max-time 30 "$BASE/api/admin/debug-cloudflare-check" || echo 000)
              echo "  [$i] HTTP $code"
              if [ "$code" = "200" ]; then
                cat /tmp/cfcheck.json; echo
                break
              fi
              echo "  még nem él az új route — várakozás 15s..."
              sleep 15
            done
          fi

          if [ -z "${CRON_SECRET:-}" ]; then
            echo "SKIPPED  production validáció — a CRON_SECRET repo-secret nincs beállítva (Settings → Secrets and variables → Actions). PRODUCTION_URL és ADMIN_SECRET repo-secretek is szükségesek a teljes futáshoz."
            exit 0
          fi

          echo "== Eredeti BBC Football RSS cikkek (összehasonlítási alap a magyar kimenethez) =="
          curl -sS --max-time 30 "https://feeds.bbci.co.uk/sport/football/rss.xml" -o /tmp/bbc.xml || true
          python3 - <<'PYEOF' || true
          import re
          try:
              with open('/tmp/bbc.xml', encoding='utf-8') as f:
                  xml = f.read()
          except FileNotFoundError:
              raise SystemExit(0)
          items = re.findall(r'<item>(.*?)</item>', xml, re.S)
          for i, item in enumerate(items[:15], 1):
              title = re.search(r'<title>(.*?)</title>', item, re.S)
              desc = re.search(r'<description>(.*?)</description>', item, re.S)
              t = (title.group(1) if title else '').strip()
              d = (desc.group(1) if desc else '').strip()
              print(f"{i}. EN cim: {t}")
              if d:
                  print(f"   EN leiras: {d[:200]}")
          PYEOF

          echo "== Seed / setup (a friss production deploy kigördülésére várva, max ~6 perc) =="
          for i in $(seq 1 24); do
            code=$(curl -sS -o /tmp/setup.json -w '%{http_code}' --max-time 120 \
              -X POST "$BASE/api/internal/setup" -H "Authorization: Bearer $CRON_SECRET" || echo 000)
            echo "  [$i] setup: HTTP $code"; cat /tmp/setup.json; echo
            provider=$(python3 -c "import json;print(json.load(open('/tmp/setup.json')).get('llmProvider','?'))" 2>/dev/null || echo "?")
            echo "  llmProvider=$provider"
            if [ "$code" = "200" ] && [ "$provider" = "cloudflare" ]; then
              echo "PASS  a friss deploy él, LLM_PROVIDER=cloudflare aktív"
              break
            fi
            echo "  meg nem a friss deploy (llmProvider=$provider) — várakozás 15s..."
            sleep 15
          done

          echo "== Valódi BBC RSS ingest =="
          code=$(curl -sS -o /tmp/ingest.json -w '%{http_code}' --max-time 280 \
            -X POST "$BASE/api/internal/cron/dispatch-ingest" -H "Authorization: Bearer $CRON_SECRET" || echo 000)
          echo "ingest: HTTP $code"; cat /tmp/ingest.json; echo

          echo "== Publikus Story API (csak a ténylegesen publikáltak — auto-publish ellenőrzés) =="
          curl -sS --max-time 30 "$BASE/api/v1/stories?limit=20" | tee /tmp/stories.json; echo

          if [ -z "${ADMIN_SECRET:-}" ]; then
            echo "SKIPPED  review queue tartalom kiírása — az ADMIN_SECRET repo-secret nincs beállítva."
            exit 0
          fi

          echo "== Review queue tartalom (cím_hu, lead_hu, ok, confidence, kockázat) =="
          admin_code=$(curl -sS -o /tmp/review.html -u "admin:$ADMIN_SECRET" -w '%{http_code}' --max-time 30 "$BASE/admin/review" || echo 000)
          echo "admin/review: HTTP $admin_code"
          python3 - <<'PYEOF' || true
          import re
          try:
              with open('/tmp/review.html', encoding='utf-8') as f:
                  html = f.read()
          except FileNotFoundError:
              raise SystemExit(0)
          articles = re.findall(r'<article.*?>(.*?)</article>', html, re.S)
          print(f"Review queue-ban: {len(articles)} Story")
          for i, art in enumerate(articles, 1):
              h2 = re.search(r'<h2[^>]*>(.*?)</h2>', art, re.S)
              p_tags = re.findall(r'<p[^>]*>(.*?)</p>', art, re.S)
              title = re.sub(r'<[^>]+>', '', h2.group(1)).strip() if h2 else ''
              lead = re.sub(r'<[^>]+>', '', p_tags[0]).strip() if p_tags else ''
              meta = re.sub(r'<[^>]+>', ' ', p_tags[1]).strip() if len(p_tags) > 1 else ''
              print(f"--- {i} ---")
              print(f"HU cim: {title}")
              print(f"HU lead: {lead}")
              print(f"meta: {meta}")
          PYEOF
