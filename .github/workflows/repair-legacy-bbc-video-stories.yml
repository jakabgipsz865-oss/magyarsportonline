name: Repair legacy BBC video Stories

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Queue targeted legacy repair
        env:
          BBC_REPAIR_TOKEN: ${{ secrets.BBC_REPAIR_TOKEN }}
          BASE: https://magyarsportonline-web.vercel.app
        run: |
          test -n "$BBC_REPAIR_TOKEN"
          curl -fsS --max-time 290 -X POST \
            "$BASE/api/internal/repair-legacy-bbc-video-stories" \
            -H "Authorization: Bearer $BBC_REPAIR_TOKEN" \
            -o repair.json
          cat repair.json
      - uses: actions/upload-artifact@v4
        with:
          name: legacy-bbc-repair-evidence
          path: repair.json
