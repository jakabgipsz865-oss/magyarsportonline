name: Deploy to Cloudflare Workers

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply PostgreSQL migrations
        run: pnpm --filter @magyarsportonline/db db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Configure production AI secrets
        run: |
          printf '%s' "$WORKERS_AI_TOKEN" | pnpm --filter @magyarsportonline/web exec wrangler secret put WORKERS_AI_API_TOKEN
          printf '%s' "$AI_GATEWAY_TOKEN" | pnpm --filter @magyarsportonline/web exec wrangler secret put CLOUDFLARE_AI_GATEWAY_TOKEN
        env:
          WORKERS_AI_TOKEN: ${{ secrets.WORKERS_AI_TOKEN }}
          AI_GATEWAY_TOKEN: ${{ secrets.AI_GATEWAY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Build and deploy web Worker
        run: pnpm --filter @magyarsportonline/web run deploy
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE: ${{ secrets.DATABASE_URL }}

      - name: Configure web runtime secrets
        run: |
          printf '%s' "$CRON_SECRET" | pnpm --filter @magyarsportonline/web exec wrangler secret put CRON_SECRET
          printf '%s' "$ADMIN_SECRET" | pnpm --filter @magyarsportonline/web exec wrangler secret put ADMIN_SECRET
          printf '%s' "$FACEBOOK_AUTO_PUBLISH" | pnpm --filter @magyarsportonline/web exec wrangler secret put FACEBOOK_AUTO_PUBLISH
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          FACEBOOK_AUTO_PUBLISH: ${{ vars.FACEBOOK_AUTO_PUBLISH || 'false' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy Facebook publisher Worker
        run: pnpm --filter @magyarsportonline/facebook-publisher run deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE: ${{ secrets.DATABASE_URL }}

      - name: Configure Facebook publisher secrets
        run: |
          printf '%s' "$FACEBOOK_AUTO_PUBLISH" | pnpm --filter @magyarsportonline/facebook-publisher exec wrangler secret put FACEBOOK_AUTO_PUBLISH
          if [ -n "$FACEBOOK_PAGE_ID" ]; then
            printf '%s' "$FACEBOOK_PAGE_ID" | pnpm --filter @magyarsportonline/facebook-publisher exec wrangler secret put FACEBOOK_PAGE_ID
          fi
          if [ -n "$FACEBOOK_PAGE_ACCESS_TOKEN" ]; then
            printf '%s' "$FACEBOOK_PAGE_ACCESS_TOKEN" | pnpm --filter @magyarsportonline/facebook-publisher exec wrangler secret put FACEBOOK_PAGE_ACCESS_TOKEN
          fi
        env:
          FACEBOOK_AUTO_PUBLISH: ${{ vars.FACEBOOK_AUTO_PUBLISH || 'false' }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy scheduler Worker
        run: pnpm --filter @magyarsportonline/ingest-scheduler run deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Configure scheduler secret
        run: printf '%s' "$CRON_SECRET" | pnpm --filter @magyarsportonline/ingest-scheduler exec wrangler secret put CRON_SECRET
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
