name: Express production proof (temporary)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Reprocess exactly one Express Story
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BASE: https://magyarsportonline-web.vercel.app
        run: |
          set -euo pipefail
          test -n "$CRON_SECRET"
          code=$(curl -sS --max-time 290 -o express-proof.json -w '%{http_code}' \
            -X POST "$BASE/api/internal/reprocess-story" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -d '{"storyId":"2de216a1-40cd-4a41-80cb-008bf3861950"}')
          test "$code" = "200"
          jq . express-proof.json
      - uses: actions/upload-artifact@v4
        with:
          name: express-production-proof
          path: express-proof.json
