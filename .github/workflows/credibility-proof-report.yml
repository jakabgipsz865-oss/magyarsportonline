# Hitelesség-magyarázat "bizonyító riport" (2026-07-28) — a felhasználó
# explicit kérésére: mutassa meg, Storynként, valódi (nem demo-) production
# adatokon, hogy a `/api/internal/credibility-proof-report` végpont hány
# forrásból építette fel az adott Storyt, melyik állítás melyik forrásból
# származik, volt-e ellentmondás és hogyan lett feloldva (a rendszer
# sosem választ oldalt — mindkét állítást megjeleníti "nem megerősített"
# státusszal), a végső hitelességi pont, és pontosan mely források
# növelték/csökkentették azt.
#
# Egyetlen HTTP hívás (a végpont a write-oldali táblákból, egy request alatt
# olvas — nincs szükség kötegelésre, mint az editorial-ab-test.yml-nél,
# mert itt nincs LLM-hívás, csak DB lekérdezés).
name: Credibility proof report

on:
  workflow_dispatch:
    inputs:
      scan_limit:
        description: "Hány legutóbb frissített Storyt vizsgáljon (1-300)"
        required: false
        default: "100"

permissions: {}

jobs:
  proof-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch proof report
        env:
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SCAN_LIMIT: ${{ inputs.scan_limit }}
        run: |
          set -u
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "CRON_SECRET repo secret hiányzik — nincs mit futtatni." >&2
            exit 1
          fi
          BASE="${PRODUCTION_URL:-https://magyarsportonline-web.vercel.app}"
          echo "Target: $BASE"

          code=$(curl -sS -o report.json -w '%{http_code}' --max-time 60 \
            "$BASE/api/internal/credibility-proof-report?scanLimit=$SCAN_LIMIT" \
            -H "Authorization: Bearer $CRON_SECRET")
          echo "HTTP $code"
          if [ "$code" != "200" ]; then
            echo "A riport-végpont hibát adott vissza:" >&2
            cat report.json >&2
            exit 1
          fi
          cat report.json

      - name: Summarize report
        run: |
          python3 << 'PYEOF'
          import json

          with open("report.json") as f:
              data = json.load(f)

          lines = []
          lines.append("# Hitelesség-magyarázat és összefésülési bizonyító riport\n")
          lines.append(f"- Generálva: {data['generatedAt']}")
          lines.append(f"- Vizsgált Story (legutóbb frissítettek): **{data['storiesScanned']}**")
          lines.append(f"- Ebből 2+ (valódi, aktív) forrásból épült Story: **{data['dualOrMoreSourceStoriesFound']}**")
          lines.append(f"- Egyetlen forrásból épült, kihagyva: {data['singleSourceStoriesSkipped']}")
          lines.append(f"- Ellentmondást tartalmazó Story: {data.get('storiesWithContradictionCount', 'n/a')}")
          counts = data.get("articleCountBySourceName", {})
          if counts:
              counts_str = ", ".join(f"{name}: {n}" for name, n in sorted(counts.items()))
              lines.append(f"- Cikkszám forrásonként (a vizsgált Story-ablakban): {counts_str}")
          lines.append("")

          stories = data["stories"]
          lines.append(
              f"## {len(stories)} db, 2+ forrásból épült Story található a vizsgált ablakban\n"
          )
          lines.append(
              "Figyelem: ez a szakasz csak a NYERS bizonyítékot adja (esemény-azonosítók, "
              "időpontok, entitások, fingerprint-alap) — a helyes/bizonytalan/téves pozitív "
              "összevonás besorolása szemantikai olvasást igényel, ezt a riportot kísérő "
              "elemzés adja meg, nem ez a szkript.\n"
          )

          for i, s in enumerate(stories, start=1):
              lines.append(f"### {i}. {s['title']}")
              if s["slug"]:
                  lines.append(f"- Slug: `{s['slug']}`")
              lines.append(f"- Hány forrásból épült fel: **{s['sourceCount']}** ({', '.join(s['sourceNames'])})")

              ei = s.get("eventIdentity") or {}
              lines.append(f"- Eseménytípus (domináns fact_type alapján): {ei.get('eventTypeHu') or 'n/a'}")
              entities_str = ", ".join(
                  f"{e['nameCanonical']} ({e['type']})" for e in ei.get("involvedEntities", [])
              )
              lines.append(f"- Érintett csapatok/játékosok: {entities_str or 'nincs egyezés'}")
              lines.append(f"- Fő állítás: {ei.get('mainClaimHu') or 'n/a'}")
              if ei.get("eventTimeDetailHu"):
                  lines.append(f"- Időpont/időablak (event_time tény): {ei['eventTimeDetailHu']}")
              lines.append("- Forrásonkénti URL:")
              for src in ei.get("perSourceUrls", []):
                  lines.append(
                      f"  - [{src['sourceName']}] {src['titleOriginal']} — {src['sourceUrl']} "
                      f"(publikálva: {src['publishedAtSource'] or 'n/a'})"
                  )
              ma = ei.get("mergeAudit") or {}
              lines.append(
                  f"- Összefésülés alapja (a rendszer NEM számol valószínűségi confidence-t — "
                  f"determinisztikus fingerprint-egyezés): {ma.get('explanationHu', 'n/a')}"
              )

              lines.append("- Állítások forrásonként:")
              for claim in s["claims"]:
                  flag = " ⚠ ellentmondó" if claim["isContradicted"] else ""
                  lines.append(
                      f"  - [{claim['sourceName']}] {claim['factTypeLabelHu']}: {claim['detailHu']}{flag}"
                  )
              lines.append(f"- Volt-e ellentmondás: **{'igen' if s['hasContradiction'] else 'nem'}**")
              if s["contradictions"]:
                  for c in s["contradictions"]:
                      lines.append(f"  - Ellentmondás ({c['factTypeLabelHu']}):")
                      for claim in c["claims"]:
                          lines.append(f"    - {claim['sourceName']} szerint: {claim['detailHu']}")
                      lines.append(f"    - Jelenlegi állapot: {c['statusHu']}")
              lines.append(f"- Hogyan oldotta fel: {s['resolutionHu']}")
              lines.append(f"- Végső hitelességi pont: **{s['finalScore']}/100** ({s['labelHu']}, band: {s['band']})")
              lines.append(f"- Miért kapta ezt a pontot: {s['justificationHu']}")
              lines.append("- Mely tényezők növelték/csökkentették a pontot:")
              for entry in s["scoreBreakdown"]:
                  sign = "+" if entry["points"] >= 0 else ""
                  lines.append(f"  - {sign}{entry['points']} — {entry['labelHu']}")
              lines.append("")

          missed_exact = data.get("missedMergeExact", [])
          lines.append(f"## Elmulasztott összevonás — pontos egyezés ({len(missed_exact)} db)\n")
          if not missed_exact:
              lines.append("Nincs — a jelenlegi entitás-táblával újraszámolva egyetlen két különböző Story sem esik pontosan ugyanarra az (entitás, nap) fingerprint-alapra.\n")
          else:
              for group in missed_exact:
                  titles = "; ".join(f"{g['title']} ({', '.join(g['sourceNames'])})" for g in group["stories"])
                  lines.append(f"- {titles}")
              lines.append("")

          missed_candidates = data.get("missedMergeCandidates", [])
          lines.append(f"## Elmulasztott összevonás — jelölt (szomszédos napok, {len(missed_candidates)} db, kézi ellenőrzést igényel)\n")
          if not missed_candidates:
              lines.append("Nincs jelölt.\n")
          else:
              for c in missed_candidates:
                  a, b = c["stories"][0], c["stories"][1]
                  lines.append(
                      f"- \"{a['title']}\" ({a['dateBucket']}, {', '.join(a['sourceNames'])}) "
                      f"vs. \"{b['title']}\" ({b['dateBucket']}, {', '.join(b['sourceNames'])})"
                  )
              lines.append("")

          # --- Scored, multi-factor Story-matching decisions (2026-07-29,
          # "téves Story-összevonás megszüntetése" sprint) --- the REAL
          # persisted decision per article, not a recomputation.
          md = data.get("matchDecisions", {})
          lines.append("## Story-matching döntések (a javított, pontozott motor valós audit-naplója)\n")
          lines.append(f"- Vizsgált döntés: **{md.get('totalDecisionsScanned', 0)}**")
          lines.append(f"- Automatikus összevonás (`auto_merge`) — valódi pozitív JELÖLT (kézi megerősítést igényel): **{md.get('autoMergeCount', 0)}**")
          lines.append(f"- Review-ba küldött bizonytalan eset (`needs_review`) — NEM vonta össze automatikusan: **{md.get('needsReviewCount', 0)}**")
          lines.append(f"- Új Story (`auto_new_story`, nincs specifikus egyező entitás vagy sportág-eltérés): **{md.get('autoNewStoryCount', 0)}**")

          entity_breakdown = md.get("entityTypeBreakdown", {})
          if entity_breakdown:
              breakdown_str = ", ".join(f"{t}: {n}" for t, n in sorted(entity_breakdown.items(), key=lambda x: -x[1]))
              lines.append(f"- Entitástípusonkénti egyezés (auto_merge + needs_review döntésekben): {breakdown_str}")
          else:
              lines.append("- Entitástípusonkénti egyezés: nincs auto_merge/needs_review döntés a vizsgált ablakban.")

          category_breakdown = md.get("matchCategoryBreakdown", {})
          if category_breakdown:
              category_str = ", ".join(f"{c}: {n}" for c, n in sorted(category_breakdown.items(), key=lambda x: -x[1]))
              lines.append(f"- Egyezés-kategóriák (ugyanaz a csapat / mérkőzés / játékos-edző / átigazolási pár): {category_str}")
          lines.append(f"- {md.get('precisionRecallNoteHu', '')}\n")

          auto_merges = md.get("autoMergeDecisions", [])
          lines.append(f"### `auto_merge` döntések bizonyítéka ({len(auto_merges)} db) — olvasd el mindegyiket, jelöld valódi/téves pozitívnak\n")
          if not auto_merges:
              lines.append("Nincs auto_merge döntés a vizsgált ablakban.\n")
          for d in auto_merges:
              matched = ", ".join(f"{e['nameCanonical']} ({e['type']})" for e in d.get("matchedEntities", []))
              lines.append(f"- \"{d['rawArticleTitle']}\" ({d.get('rawArticleUrl', 'n/a')})")
              lines.append(f"  - Összevonva ide: \"{d.get('resultingStoryTitle', 'n/a')}\" (slug: {d.get('resultingStorySlug', 'n/a')})")
              lines.append(f"  - Match score: {d['matchScore']}/100, kategória: {d.get('matchCategoryLabelHu', 'n/a')}, egyező entitások: {matched or 'nincs'}")
              lines.append(f"  - Indoklás: {d['decisionReasonHu']}")
          lines.append("")

          needs_review = md.get("needsReviewDecisions", [])
          lines.append(f"### `needs_review` döntések bizonyítéka ({len(needs_review)} db) — review-ba küldött bizonytalan esetek\n")
          if not needs_review:
              lines.append("Nincs needs_review döntés a vizsgált ablakban.\n")
          for d in needs_review:
              matched = ", ".join(f"{e['nameCanonical']} ({e['type']})" for e in d.get("matchedEntities", []))
              lines.append(f"- \"{d['rawArticleTitle']}\" ({d.get('rawArticleUrl', 'n/a')})")
              lines.append(f"  - Jelölt Story (NEM vonta össze): \"{d.get('candidateStoryTitle', 'n/a')}\" (slug: {d.get('candidateStorySlug', 'n/a')})")
              lines.append(f"  - Ehelyett saját Story jött létre: \"{d.get('resultingStoryTitle', 'n/a')}\" (slug: {d.get('resultingStorySlug', 'n/a')})")
              lines.append(f"  - Match score: {d['matchScore']}/100, kategória: {d.get('matchCategoryLabelHu', 'n/a')}, egyező entitások: {matched or 'nincs'}, review-státusz: {d.get('reviewStatus', 'n/a')}")
              lines.append(f"  - Indoklás: {d['decisionReasonHu']}")
          lines.append("")

          report = "\n".join(lines)
          print(report)
          with open("report.md", "w") as f:
              f.write(report)
          PYEOF
          cat report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload full report
        uses: actions/upload-artifact@v4
        with:
          name: credibility-proof-report
          path: |
            report.json
            report.md
