# Free-tier production follow-up cycles.
#
# The automatic production rollout receives first access to the daily Cloudflare
# Workers AI free quota at 00:10 UTC. These later cycles poll new RSS sources and
# resume the durable queue without competing for the freshly reset quota.
#
# Előfeltétel (repo Settings → Secrets and variables → Actions):
#   PRODUCTION_URL  — pl. https://magyarsportonline-web.vercel.app (opcionális)
#   CRON_SECRET     — ugyanaz az érték, mint a Vercel env-ben (kötelező)
# Amíg a CRON_SECRET nincs beállítva, a workflow csendben (sikeresen) kilép.
name: Scheduled pipeline (ingest + job processing)

on:
  schedule:
    - cron: "15 3,9,15,21 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Dispatch ingest (RSS poll + enqueue)
        env:
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -u
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "CRON_SECRET repo secret not configured — skipping."
            exit 0
          fi
          BASE="${PRODUCTION_URL:-https://magyarsportonline-web.vercel.app}"
          echo "Target: $BASE"
          http_code=$(curl -sS -o /tmp/ingest-body.json -w '%{http_code}' \
            --max-time 60 --retry 2 --retry-delay 5 \
            -X POST "$BASE/api/internal/cron/dispatch-ingest" \
            -H "Authorization: Bearer $CRON_SECRET")
          echo "ingest: HTTP $http_code"
          cat /tmp/ingest-body.json
          echo
          test "$http_code" = "200"

      - name: Process pipeline jobs (drain the queue)
        if: ${{ !cancelled() }}
        env:
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -u
          if [ -z "${CRON_SECRET:-}" ]; then
            exit 0
          fi
          BASE="${PRODUCTION_URL:-https://magyarsportonline-web.vercel.app}"
          # Call the worker repeatedly until it reports no jobs left to
          # process (processed=0) or a sane iteration cap is hit — one call
          # only drains what fits in its own ~40s budget (see
          # apps/web/app/api/internal/jobs/process/route.ts), so a real
          # backlog needs several calls in the same workflow run to fully
          # catch up rather than waiting for the next scheduled cycle.
          #
          # A zöld workflow csak megfigyelt, szabályos worker-választ jelent.
          # A korábbi 90s kliens-timeout elrejtette a beragadt LLM-jobokat és
          # hamis sikert mutatott. A Vercel route 300s maximummal fut; a
          # kliens 290s-ig vár, és válasz nélküli timeoutnál a run piros.
          for i in $(seq 1 4); do
            set +e
            http_code=$(curl -sS -o /tmp/jobs-body.json -w '%{http_code}' \
              --max-time 290 \
              -X POST "$BASE/api/internal/jobs/process" \
              -H "Authorization: Bearer $CRON_SECRET")
            curl_exit=$?
            set -e
            if [ "$curl_exit" -ne 0 ]; then
              echo "jobs/process attempt $i: curl exit $curl_exit (timeout or connection issue)."
              exit 1
            fi
            echo "jobs/process attempt $i: HTTP $http_code"
            cat /tmp/jobs-body.json
            echo
            if [ "$http_code" != "200" ]; then
              exit 1
            fi
            processed=$(python3 -c "import json;print(json.load(open('/tmp/jobs-body.json'))['processed'])" 2>/dev/null || echo 0)
            quota_deferred=$(python3 -c "import json;print(str(json.load(open('/tmp/jobs-body.json')).get('quotaDeferred', False)).lower())" 2>/dev/null || echo false)
            dead_lettered=$(python3 -c "import json;print(json.load(open('/tmp/jobs-body.json')).get('deadLettered', 0))" 2>/dev/null || echo 0)
            dead_letter=$(python3 -c "import json;print(json.load(open('/tmp/jobs-body.json')).get('queue', {}).get('deadLetter', 0))" 2>/dev/null || echo 0)
            if [ "$dead_lettered" -gt "0" ]; then
              echo "Pipeline created new dead-letter jobs in this run: $dead_lettered"
              exit 1
            fi
            if [ "$dead_letter" -gt "0" ]; then
              echo "Historical dead-letter jobs awaiting controlled recovery: $dead_letter"
            fi
            if [ "$quota_deferred" = "true" ]; then
              echo "Cloudflare daily neuron quota deferred until the reported retryAt; stopping this drain loop."
              break
            fi
            if [ "$processed" = "0" ]; then
              echo "Queue drained."
              break
            fi
          done
