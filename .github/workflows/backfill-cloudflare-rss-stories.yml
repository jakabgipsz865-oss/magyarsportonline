name: Backfill Cloudflare RSS stories

on:
  workflow_dispatch:
    inputs:
      page:
        description: Public story-list page to repair
        required: true
        default: "1"
        type: string
      limit:
        description: Number of stories to repair (maximum 50)
        required: true
        default: "50"
        type: string
  push:
    tags:
      - "rss-backfill-*"

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60
    steps:
      - name: Rewrite published stories from complete source pages
        run: |
          set -o pipefail
          : > /tmp/results.ndjson
          curl -fsS --max-time 30 \
            "$PUBLIC_ORIGIN/api/v1/stories?page=$PAGE&limit=$LIMIT" > /tmp/stories.json
          jq -r '.data[].slug' /tmp/stories.json | while IFS= read -r slug; do
            echo "Rewriting $slug"
            jq -nc --arg slug "$slug" '{action:"rewrite-story", slug:$slug}' > /tmp/request.json
            : > /tmp/response.json
            set +e
            code=$(curl -sS --max-time 300 -o /tmp/response.json -w '%{http_code}' \
              -X POST "$WORKER_ORIGIN/api/internal/tabloid-rollout" \
              -H "Authorization: Bearer $CRON_SECRET" \
              -H 'Content-Type: application/json' \
              --data-binary @/tmp/request.json)
            curl_status=$?
            set -e
            if jq -e . /tmp/response.json > /dev/null 2>&1; then
              response=$(jq -c . /tmp/response.json)
            else
              response=$(jq -Rs . /tmp/response.json)
            fi
            jq -nc \
              --arg slug "$slug" \
              --arg code "$code" \
              --arg curlStatus "$curl_status" \
              --argjson response "$response" \
              '{slug:$slug,httpStatus:($code|tonumber),curlStatus:($curlStatus|tonumber),response:$response}' \
              >> /tmp/results.ndjson
          done
          jq -s '.' /tmp/results.ndjson | tee /tmp/results.json
          test "$(jq -s '[.[] | select(.httpStatus != 200 or .curlStatus != 0 or .response.published? != true)] | length' /tmp/results.ndjson)" = "0"
        env:
          PUBLIC_ORIGIN: https://magyarsportonline.hu
          WORKER_ORIGIN: https://magyarsportonline-web.footballinvestmentkft.workers.dev
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PAGE: ${{ inputs.page || '1' }}
          LIMIT: ${{ inputs.limit || '50' }}

      - name: Upload backfill report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-rss-backfill-${{ github.run_id }}
          path: /tmp/results.json
          if-no-files-found: ignore
          retention-days: 30
